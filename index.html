<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c4dff">
<title>PikoLumi – Kids Creative World</title>
<style>
:root{--purple:#7047d9;--pink:#ff72b6;--blue:#52b9ee;--ink:#30264b}
*{box-sizing:border-box}body{margin:0;background:#fff9fd;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 14px 8px;text-align:center;background:linear-gradient(135deg,#f2eaff,#e9f8ff)}
.logo{width:min(230px,65vw);height:auto;border-radius:22px;box-shadow:0 5px 18px #6f4a991c}
h1{font-size:clamp(25px,6vw,36px);margin:8px 0 2px;color:#6339c7}
.tag{margin:0 0 10px;color:#655b79;font-weight:700}
main{max-width:900px;margin:auto;padding:16px}
.welcome{text-align:center;font-size:18px;font-weight:700;margin:6px 0 15px}
.tabs,.palette{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px 0}
button{border:0;border-radius:14px;padding:11px 16px;font-size:15px;font-weight:700;background:#eee7ff;color:#50349b;cursor:pointer}
button.active{background:var(--purple);color:white}
.workspace{background:white;border:2px solid #eee5ff;border-radius:22px;padding:12px;box-shadow:0 8px 25px #55358b12}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;background:white;border:1px dashed #d8cbed;border-radius:14px;touch-action:pan-y;cursor:crosshair}
.palette button{width:38px;height:38px;padding:0;border:3px solid white;box-shadow:0 0 0 1px #ddd;border-radius:50%}
.palette button.chosen{outline:3px solid #5b3da8;outline-offset:2px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.actions button:last-child{background:#ffe6f2;color:#a72e71}
.hint{text-align:center;color:#756b84;font-size:14px;margin:12px 0 2px}
footer{text-align:center;padding:20px;color:#897e9b;font-size:12px}
</style>
</head>

 if(sr<180|| (Math.abs(sr-parseInt(fill.slice(1,3),16))<5&&Math.abs(sg-parseInt(fill.slice(3,5),16))<5&&Math.abs(sb-parseInt(fill.slice(5,7),16))<5))return;
 const stack=[[x,y]],seen=new Uint8Array(w*h);let count=0;

 while(stack.length&&count<150000){const p=stack.pop(),px=p[0],py=p[1];if(px<0||py<0||px>=w||py>=h)continue;const pos=py*w+px;if(seen[pos])continue;seen[pos]=1;const i=pos*4;if(!match(i))continue;d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=255;count++;stack.push([px+1,py],[px-1,py],[px,py+1],[px,py-1])}
 ctx.putImageData(img,0,0);
}
